<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .conteiner{
            border: 2px solid blue;
            display: grid;
            height: 450px;
            grid-template: repeat(3, auto)/repeat(4, 1fr);
        }
        .item{
            border: 2px solid red;
            padding: 15px;
            text-align: center;
        }
        *{
            text-align: center;
        }
        .caixa1{
            border: 2px solid red;
            grid-row: 1 / 2 ;
            grid-column: 1 / 5;
        }
        .caixa2{
            border: 2px solid rgb(21, 0, 255);
            grid-row: 2 / 4;
            grid-column: 1 / 3;
        }
        .caixa3{
            border: 2px solid rgb(47, 255, 0);
            grid-row: 2 / 4;
            grid-column: 3 / 5;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="caixa1">caixa1</div>
        <div class="caixa2">caixa2</div>
        <div class="caixa3">caixa3</div>
    </div>
</body>
</html>
