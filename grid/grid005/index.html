<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .conteiner{
            border: 2px solid blue;
            display: grid;
            height: 450px;
            grid-template: 70px 50px 1fr 45px/1fr 1.8fr 1fr;
        }
        .item{
            border: 2px solid red;
            padding: 15px;
            text-align: center;
        }
        *{
            text-align: center;
        }
        .caixa1{
            border: 2px solid red;
            grid-row: 1 / 2 ;
            grid-column: 1 / 5;
        }
        .caixa2{
            border: 2px solid rgb(21, 0, 255);
            grid-row: 2 / span 1;
            grid-column: 1 / -1;
        }
        .caixa3{
            border: 2px solid rgb(202, 23, 199);
            grid-row: 3 / span 1;
            grid-column: 1 / -2;
        }
        .caixa4{
            border: 2px solid rgb(47, 255, 0);
            grid-row: 3 / -2;
            grid-column: 3 / -1;
        }
        .caixa5{
            border: 2px solid rgb(47, 255, 0);
            grid-row: -2 / -1;
            grid-column: 1 / 5;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="caixa1">topo</div>
        <div class="caixa2">menu</div>
        <div class="caixa3">principal</div>
        <div class="caixa4">secundario</div>
        <div class="caixa5">rodape</div>
        
    </div>
</body>
</html>
