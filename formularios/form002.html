<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form002</title>
    <style>
    
    </style>
</head>
<body>
    <h1>teste de formularios</h1>
    <form autocomplete="off" action="cadastro.py" method="post">
        <div>
            <label for="iusuario">usuario:</label>
            <input type="text" name="usuario" id="iusuario" required placeholder="nome do usuario" autocomplete="username">
        </div>
        <div>
            <label for="isenha">senha:</label>
            <input type="password" name="senha" id="isenha" required placeholder="senha" autocomplete="current-password"> 
        </div>
        <input type="submit" value="entrar">
        <input type="reset" value="limpar">
    </form>
</body>
</html>
