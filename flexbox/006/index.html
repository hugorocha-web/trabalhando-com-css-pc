<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justify content e aligh itens</title>
    <style>
        *{
            padding: 0px;
            margin:0px;
        }
        .conteiner{
            display: flex;
            justify-content: center;
            background-color: aqua;
            flex-flow: row nowrap;

        }
        .item{
            border: 1px solid black;
            padding: 20px;
            
            text-align: center;
            
        }
        #i1{
            flex: 0 2 150px;
        }
        #i2{
            flex: 2 0 150px;
        }
        #i3{
            flex: 1 1 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">a</div>
        <div class="item" id="i2">b</div>
        <div class="item" id="i3">c</div>
    </div>
</body>
</html>
